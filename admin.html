<!DOCTYPE html>
<!--
============================================================================
 Super Budgeting System (SBS) — admin.html
 Protected developer view: lists all users (name, username, email, joined)
 and all feedback/complaints (who, when, message). Requires the admin token.
============================================================================
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1E1F24">
  <title>Admin · Super Budgeting System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: {
      lime: { 100:'#ECFCCB',200:'#E4F993',300:'#D9F99D',400:'#D4ED76',700:'#3F6212' },
      lavender: { 100:'#E0E7FF',300:'#A5B4FC',400:'#818CF8',500:'#6366F1',600:'#4F46E5',700:'#4338CA' }
    } } } };
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Manrope', system-ui, sans-serif; background: #1E1F24; }
    .gloss { background-image: linear-gradient(135deg,#ECFCAA 0%,#E4F993 60%,#D4ED76 100%); color:#23281A; }
  </style>
</head>
<body class="min-h-screen text-slate-100">
  <div class="max-w-5xl mx-auto p-4 sm:p-6 space-y-6">

    <header class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl gloss flex items-center justify-center"><i data-lucide="shield" class="w-5 h-5"></i></div>
        <div>
          <h1 class="font-bold text-lg">SBS Admin</h1>
          <p class="text-[11px] text-slate-400">Users & feedback</p>
        </div>
      </div>
      <a href="/" class="text-xs text-slate-400 hover:text-white">Back to app</a>
    </header>

    <!-- Token gate -->
    <div id="gate" class="bg-[#25272E] border border-[#323540] rounded-2xl p-5 max-w-md mx-auto space-y-3">
      <label class="text-xs font-semibold text-slate-300 block">Admin Token</label>
      <input id="admin-token" type="password" placeholder="Enter admin token" class="w-full px-3 py-2 rounded-lg bg-[#1E1F24] border border-[#323540] text-sm outline-none focus:border-lime-400">
      <button onclick="loadData()" class="w-full gloss font-bold text-sm py-2.5 rounded-lg">Unlock</button>
      <p id="gate-msg" class="text-xs text-lavender-300 hidden"></p>
    </div>

    <!-- Results -->
    <div id="results" class="hidden space-y-6">
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="bg-[#25272E] border border-[#323540] rounded-2xl p-4">
          <p class="text-[10px] uppercase text-slate-400 font-bold">Total Users</p>
          <p id="stat-users" class="text-2xl font-bold text-lime-300 mt-1">0</p>
        </div>
        <div class="bg-[#25272E] border border-[#323540] rounded-2xl p-4">
          <p class="text-[10px] uppercase text-slate-400 font-bold">Feedback</p>
          <p id="stat-feedback" class="text-2xl font-bold text-lavender-300 mt-1">0</p>
        </div>
        <div class="bg-[#25272E] border border-[#323540] rounded-2xl p-4">
          <p class="text-[10px] uppercase text-slate-400 font-bold">Last Updated</p>
          <p id="stat-updated" class="text-sm font-semibold text-slate-300 mt-1">—</p>
        </div>
      </div>

      <!-- Users -->
      <div class="bg-[#25272E] border border-[#323540] rounded-2xl overflow-hidden">
        <div class="px-4 py-3 border-b border-[#323540] text-sm font-bold">Users</div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead class="text-slate-400 bg-[#1E1F24]">
              <tr>
                <th class="p-2.5">Name</th>
                <th class="p-2.5">Username</th>
                <th class="p-2.5">Email</th>
                <th class="p-2.5">Joined</th>
              </tr>
            </thead>
            <tbody id="users-tbody" class="divide-y divide-[#323540]"></tbody>
          </table>
        </div>
      </div>

      <!-- Feedback -->
      <div class="bg-[#25272E] border border-[#323540] rounded-2xl overflow-hidden">
        <div class="px-4 py-3 border-b border-[#323540] text-sm font-bold">Feedback & Complaints</div>
        <div id="feedback-list" class="divide-y divide-[#323540]"></div>
      </div>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
    function fmtDate(s) { try { return new Date(s).toLocaleString(); } catch (e) { return s || ''; } }

    async function loadData() {
      const token = $('admin-token').value.trim();
      const msg = $('gate-msg');
      msg.classList.add('hidden');
      try {
        const r = await fetch('/api/admin/data', { headers: { 'x-admin-token': token } });
        const j = await r.json();
        if (!r.ok || !j.success) {
          msg.textContent = j.error || 'Invalid token';
          msg.classList.remove('hidden');
          return;
        }
        $('gate').classList.add('hidden');
        $('results').classList.remove('hidden');
        $('stat-users').textContent = j.count;
        $('stat-feedback').textContent = (j.feedback || []).length;
        $('stat-updated').textContent = new Date().toLocaleTimeString();

        const tb = $('users-tbody');
        tb.innerHTML = (j.users || []).map(u => `
          <tr>
            <td class="p-2.5 font-semibold text-slate-100">${esc(u.name)}</td>
            <td class="p-2.5 text-slate-300">${esc(u.username)}</td>
            <td class="p-2.5 text-slate-400">${esc(u.email) || '—'}</td>
            <td class="p-2.5 text-slate-400">${esc(fmtDate(u.created_at))}</td>
          </tr>`).join('') || '<tr><td colspan="4" class="p-4 text-center text-slate-500">No users yet</td></tr>';

        const fl = $('feedback-list');
        fl.innerHTML = (j.feedback || []).map(f => `
          <div class="p-3">
            <div class="flex justify-between text-xs mb-1">
              <span class="font-bold text-lavender-300">${esc(f.username) || 'Unknown'}</span>
              <span class="text-slate-500">${esc(fmtDate(f.created_at))}</span>
            </div>
            <p class="text-xs text-slate-300 whitespace-pre-wrap">${esc(f.message)}</p>
          </div>`).join('') || '<div class="p-4 text-center text-slate-500 text-xs">No feedback yet</div>';

        lucide.createIcons();
      } catch (e) {
        msg.textContent = 'Could not reach the server.';
        msg.classList.remove('hidden');
      }
    }
    document.getElementById('admin-token').addEventListener('keydown', e => { if (e.key === 'Enter') loadData(); });
    lucide.createIcons();
  </script>
</body>
</html>
