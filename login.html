<!DOCTYPE html>
<!--
============================================================================
 Super Budgeting System (SBS) — login.html (Firebase Auth + TOTP 2FA)
 Sign in with Google or email/password, then verify an authenticator code.
 "Remember me" keeps the session for 30 days.
============================================================================
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1E1F24">
  <title>Sign in · Super Budgeting System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: {
      lime: { 50:'#F7FEE7',100:'#ECFCCB',200:'#E4F993',300:'#D9F99D',400:'#D4ED76',700:'#3F6212' }
    } } } };
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="firebase-config.js"></script>
  <script src="totp.js"></script>
  <style>
    body { font-family: 'Manrope', system-ui, sans-serif;
      background: radial-gradient(circle at 15% 15%, rgba(129,140,248,0.10), transparent 45%),
                  radial-gradient(circle at 85% 85%, rgba(228,249,147,0.08), transparent 45%), #1E1F24; }
    .gloss { background-image: linear-gradient(135deg,#ECFCAA 0%,#E4F993 60%,#D4ED76 100%); color:#23281A; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-100">
  <div class="w-full max-w-md bg-[#25272E] border border-[#323540] rounded-2xl shadow-2xl p-6">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-10 h-10 rounded-xl gloss flex items-center justify-center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>
      </div>
      <div>
        <h1 class="font-bold text-lg leading-tight">SuperBudget</h1>
        <p class="text-[11px] text-slate-400">Sign in to your account</p>
      </div>
    </div>

    <div class="flex gap-1 bg-[#1E1F24] border border-[#323540] rounded-xl p-1 mb-5 text-xs font-semibold">
      <button data-tab="login" class="tab-btn flex-1 py-2 rounded-lg bg-[#323540] text-white">Login</button>
      <button data-tab="register" class="tab-btn flex-1 py-2 rounded-lg text-slate-400">Create Account</button>
    </div>

    <div id="msg" class="hidden text-xs rounded-lg px-3 py-2 mb-4"></div>

    <button id="google-btn" class="w-full flex items-center justify-center gap-2 bg-white text-slate-800 font-semibold text-sm py-2.5 rounded-lg mb-4 hover:bg-slate-100 transition">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.8l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      <span>Continue with Google</span>
    </button>

    <div class="flex items-center gap-2 mb-4 text-[11px] text-slate-500">
      <div class="flex-1 h-px bg-[#323540]"></div><span>or</span><div class="flex-1 h-px bg-[#323540]"></div>
    </div>

    <form id="form-login" class="space-y-3 tab-panel">
      <div>
        <label class="text-xs font-semibold text-slate-300 block mb-1">Email</label>
        <input id="login-email" type="email" required class="w-full px-3 py-2 rounded-lg bg-[#1E1F24] border border-[#323540] text-sm outline-none focus:border-lime-400">
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-300 block mb-1">Password</label>
        <input id="login-password" type="password" required class="w-full px-3 py-2 rounded-lg bg-[#1E1F24] border border-[#323540] text-sm outline-none focus:border-lime-400">
      </div>
      <label class="flex items-center gap-2 text-xs text-slate-300">
        <input id="remember-login" type="checkbox" class="accent-lime-400"> Remember me for 30 days
      </label>
      <button type="submit" class="w-full gloss font-bold text-sm py-2.5 rounded-lg">Sign In</button>
    </form>

    <form id="form-register" class="space-y-3 tab-panel hidden">
      <div>
        <label class="text-xs font-semibold text-slate-300 block mb-1">Full Name</label>
        <input id="reg-name" type="text" required class="w-full px-3 py-2 rounded-lg bg-[#1E1F24] border border-[#323540] text-sm outline-none focus:border-lime-400">
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-300 block mb-1">Email</label>
        <input id="reg-email" type="email" required class="w-full px-3 py-2 rounded-lg bg-[#1E1F24] border border-[#323540] text-sm outline-none focus:border-lime-400">
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-300 block mb-1">Password (min 8 chars)</label>
        <input id="reg-password" type="password" required minlength="8" class="w-full px-3 py-2 rounded-lg bg-[#1E1F24] border border-[#323540] text-sm outline-none focus:border-lime-400">
      </div>
      <label class="flex items-center gap-2 text-xs text-slate-300">
        <input id="remember-register" type="checkbox" class="accent-lime-400"> Remember me for 30 days
      </label>
      <button type="submit" class="w-full gloss font-bold text-sm py-2.5 rounded-lg">Create Account</button>
    </form>
  </div>

  <!-- 2FA / Authenticator -->
  <div id="twofa" class="hidden fixed inset-0 bg-slate-900/70 flex items-center justify-center p-4 z-50">
    <div class="bg-[#25272E] border border-[#323540] rounded-2xl p-6 max-w-sm w-full space-y-3">
      <h3 id="twofa-title" class="font-bold text-white text-lg">Two-factor authentication</h3>
      <p id="twofa-desc" class="text-xs text-slate-400"></p>
      <div id="twofa-qr-wrap" class="hidden flex justify-center">
        <div id="twofa-qr" class="bg-white p-2 rounded-lg"></div>
      </div>
      <div id="twofa-secret-wrap" class="hidden bg-[#1E1F24] border border-[#323540] rounded-lg p-2">
        <p class="text-[10px] uppercase text-slate-500 font-bold">Manual key</p>
        <p id="twofa-secret" class="text-xs font-mono break-all text-lime-200"></p>
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-300 block mb-1">6-digit code</label>
        <input id="twofa-code" inputmode="numeric" maxlength="6" placeholder="000000" class="w-full px-3 py-2 rounded-lg bg-[#1E1F24] border border-[#323540] text-sm tracking-widest text-center text-white outline-none focus:border-lime-400">
      </div>
      <button id="twofa-submit" class="w-full gloss font-bold text-sm py-2.5 rounded-lg">Verify</button>
      <p id="twofa-msg" class="text-xs text-red-300 hidden"></p>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const msg = $('msg');
    function showMsg(text, ok) {
      msg.classList.remove('hidden');
      msg.textContent = text;
      msg.className = 'text-xs rounded-lg px-3 py-2 mb-4 ' + (ok ? 'bg-lime-100 text-lime-800' : 'bg-red-100 text-red-700');
    }
    function clearMsg() { msg.classList.add('hidden'); }

    let firebaseReady = false;
    try {
      if (window.FIREBASE_CONFIG && window.firebase) {
        firebase.initializeApp(window.FIREBASE_CONFIG);
        firebaseReady = true;
      }
    } catch (e) { console.warn(e); }
    if (!firebaseReady) showMsg('Firebase is not configured. Fill in firebase-config.js.', false);

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('bg-[#323540]','text-white'); b.classList.add('text-slate-400'); });
        btn.classList.add('bg-[#323540]','text-white'); btn.classList.remove('text-slate-400');
        const tab = btn.dataset.tab;
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
        $('form-' + tab).classList.remove('hidden');
        clearMsg();
      });
    });

    function go() { location.href = 'index.html'; }

    async function setRemember(remember) {
      try {
        await firebase.auth().setPersistence(remember ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION);
        if (remember) localStorage.setItem('sbs_remember_until', String(Date.now() + 30 * 24 * 3600 * 1000));
        else localStorage.removeItem('sbs_remember_until');
      } catch (e) {}
    }

    let pendingUser = null, pendingSecret = null, twofaMode = null;

    function show2FA(mode, secret, account) {
      twofaMode = mode;
      pendingSecret = secret;
      $('twofa').classList.remove('hidden');
      $('twofa-code').value = '';
      $('twofa-msg').classList.add('hidden');
      if (mode === 'enroll') {
        $('twofa-title').textContent = 'Set up authenticator';
        $('twofa-desc').textContent = 'Scan the QR with Google Authenticator / Authy, then enter the 6-digit code.';
        $('twofa-qr-wrap').classList.remove('hidden');
        $('twofa-secret-wrap').classList.remove('hidden');
        $('twofa-secret').textContent = secret;
        $('twofa-qr').innerHTML = '';
        try { new QRCode($('twofa-qr'), { text: window.SBSTOTP.otpauthUri(secret, account), width: 160, height: 160 }); } catch (e) {}
        $('twofa-submit').textContent = 'Enable & Continue';
      } else {
        $('twofa-title').textContent = 'Two-factor authentication';
        $('twofa-desc').textContent = 'Enter the 6-digit code from your authenticator app.';
        $('twofa-qr-wrap').classList.add('hidden');
        $('twofa-secret-wrap').classList.add('hidden');
        $('twofa-submit').textContent = 'Verify';
      }
      setTimeout(() => $('twofa-code').focus(), 100);
    }

    async function afterAuth(cred, remember) {
      await setRemember(remember);
      pendingUser = cred.user;
      try {
        const db = firebase.firestore();
        const doc = await db.collection('users').doc(cred.user.uid).get();
        const secret = doc.exists && doc.data().totpSecret ? doc.data().totpSecret : null;
        if (secret) show2FA('challenge', secret, cred.user.email);
        else show2FA('enroll', window.SBSTOTP.generateSecret(), cred.user.email);
      } catch (e) {
        // If Firestore is unavailable, still allow (2FA can be set up later).
        sessionStorage.setItem('sbs_2fa', 'ok');
        if (remember) localStorage.setItem('sbs_2fa', 'ok');
        go();
      }
    }

    $('twofa-submit').addEventListener('click', async () => {
      const code = $('twofa-code').value.trim();
      const ok = await window.SBSTOTP.verify(pendingSecret, code);
      if (!ok) { $('twofa-msg').textContent = 'Invalid code.'; $('twofa-msg').classList.remove('hidden'); return; }
      try {
        if (twofaMode === 'enroll') {
          await firebase.firestore().collection('users').doc(pendingUser.uid).set({ totpSecret: pendingSecret }, { merge: true });
        }
        sessionStorage.setItem('sbs_2fa', 'ok');
        if (localStorage.getItem('sbs_remember_until')) localStorage.setItem('sbs_2fa', 'ok');
        $('twofa').classList.add('hidden');
        go();
      } catch (e) {
        $('twofa-msg').textContent = e.message || 'Could not save 2FA.';
        $('twofa-msg').classList.remove('hidden');
      }
    });

    $('google-btn').addEventListener('click', async () => {
      clearMsg();
      if (!firebaseReady) return;
      const remember = $('remember-login').checked || $('remember-register').checked;
      try {
        await setRemember(remember);
        const provider = new firebase.auth.GoogleAuthProvider();
        const cred = await firebase.auth().signInWithPopup(provider);
        // First Google login: also require a password for future email login.
        const hasPassword = (cred.user.providerData || []).some(p => p.providerId === 'password');
        if (!hasPassword) {
          // Ask for a password first, then 2FA.
          pendingUser = cred.user;
          showSetPassword(cred, remember);
          return;
        }
        await afterAuth(cred, remember);
      } catch (e) { showMsg(e.message || 'Google sign-in failed.', false); }
    });

    // Inline set-password prompt (first Google login)
    function showSetPassword(cred, remember) {
      const pw = prompt('Set a password (min 8 chars) so you can also log in by email:');
      if (!pw) { afterAuth(cred, remember); return; }
      if (pw.length < 8) { showMsg('Password must be at least 8 characters.', false); return; }
      cred.user.updatePassword(pw).then(() => afterAuth(cred, remember)).catch(e => showMsg(e.message || 'Could not set password.', false));
    }

    $('form-login').addEventListener('submit', async (e) => {
      e.preventDefault(); clearMsg();
      if (!firebaseReady) return;
      const remember = $('remember-login').checked;
      try {
        await setRemember(remember);
        const cred = await firebase.auth().signInWithEmailAndPassword($('login-email').value.trim(), $('login-password').value);
        await afterAuth(cred, remember);
      } catch (e) { showMsg(e.message || 'Login failed.', false); }
    });

    $('form-register').addEventListener('submit', async (e) => {
      e.preventDefault(); clearMsg();
      if (!firebaseReady) return;
      const remember = $('remember-register').checked;
      try {
        await setRemember(remember);
        const cred = await firebase.auth().createUserWithEmailAndPassword($('reg-email').value.trim(), $('reg-password').value);
        try { await cred.user.updateProfile({ displayName: $('reg-name').value.trim() }); } catch (err) {}
        await afterAuth(cred, remember);
      } catch (e) { showMsg(e.message || 'Registration failed.', false); }
    });
  </script>
</body>
</html>
