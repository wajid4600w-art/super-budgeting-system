<!DOCTYPE html>
<!--
============================================================================
 Super Budgeting System (SBS) — login.html (Firebase Auth)
 Sign in with Google, or email + password. Redirects to the app on success.
============================================================================
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1E1F24">
  <title>Sign in · Super Budgeting System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: {
      lime: { 50:'#F7FEE7',100:'#ECFCCB',200:'#E4F993',300:'#D9F99D',400:'#D4ED76',700:'#3F6212' }
    } } } };
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <style>
    body { font-family: 'Manrope', system-ui, sans-serif;
      background: radial-gradient(circle at 15% 15%, rgba(129,140,248,0.10), transparent 45%),
                  radial-gradient(circle at 85% 85%, rgba(228,249,147,0.08), transparent 45%), #1E1F24; }
    .gloss { background-image: linear-gradient(135deg,#ECFCAA 0%,#E4F993 60%,#D4ED76 100%); color:#23281A; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-100">
  <div class="w-full max-w-md bg-[#25272E] border border-[#323540] rounded-2xl shadow-2xl p-6">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-10 h-10 rounded-xl gloss flex items-center justify-center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>
      </div>
      <div>
        <h1 class="font-bold text-lg leading-tight">SuperBudget</h1>
        <p class="text-[11px] text-slate-400">Sign in to your account</p>
      </div>
    </div>

    <div class="flex gap-1 bg-[#1E1F24] border border-[#323540] rounded-xl p-1 mb-5 text-xs font-semibold">
      <button data-tab="login" class="tab-btn flex-1 py-2 rounded-lg bg-[#323540] text-white">Login</button>
      <button data-tab="register" class="tab-btn flex-1 py-2 rounded-lg text-slate-400">Create Account</button>
    </div>

    <div id="msg" class="hidden text-xs rounded-lg px-3 py-2 mb-4"></div>

    <!-- Google sign-in (works for both login & signup) -->
    <button id="google-btn" class="w-full flex items-center justify-center gap-2 bg-white text-slate-800 font-semibold text-sm py-2.5 rounded-lg mb-4 hover:bg-slate-100 transition">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.8l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      <span>Continue with Google</span>
    </button>

    <div class="flex items-center gap-2 mb-4 text-[11px] text-slate-500">
      <div class="flex-1 h-px bg-[#323540]"></div><span>or</span><div class="flex-1 h-px bg-[#323540]"></div>
    </div>

    <!-- LOGIN -->
    <form id="form-login" class="space-y-3 tab-panel">
      <div>
        <label class="text-xs font-semibold text-slate-300 block mb-1">Email</label>
        <input id="login-email" type="email" required class="w-full px-3 py-2 rounded-lg bg-[#1E1F24] border border-[#323540] text-sm outline-none focus:border-lime-400">
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-300 block mb-1">Password</label>
        <input id="login-password" type="password" required class="w-full px-3 py-2 rounded-lg bg-[#1E1F24] border border-[#323540] text-sm outline-none focus:border-lime-400">
      </div>
      <button type="submit" class="w-full gloss font-bold text-sm py-2.5 rounded-lg">Sign In</button>
    </form>

    <!-- REGISTER -->
    <form id="form-register" class="space-y-3 tab-panel hidden">
      <div>
        <label class="text-xs font-semibold text-slate-300 block mb-1">Full Name</label>
        <input id="reg-name" type="text" required class="w-full px-3 py-2 rounded-lg bg-[#1E1F24] border border-[#323540] text-sm outline-none focus:border-lime-400">
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-300 block mb-1">Email</label>
        <input id="reg-email" type="email" required class="w-full px-3 py-2 rounded-lg bg-[#1E1F24] border border-[#323540] text-sm outline-none focus:border-lime-400">
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-300 block mb-1">Password (min 8 chars)</label>
        <input id="reg-password" type="password" required minlength="8" class="w-full px-3 py-2 rounded-lg bg-[#1E1F24] border border-[#323540] text-sm outline-none focus:border-lime-400">
      </div>
      <button type="submit" class="w-full gloss font-bold text-sm py-2.5 rounded-lg">Create Account</button>
    </form>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const msg = $('msg');
    function showMsg(text, ok) {
      msg.classList.remove('hidden');
      msg.textContent = text;
      msg.className = 'text-xs rounded-lg px-3 py-2 mb-4 ' + (ok ? 'bg-lime-100 text-lime-800' : 'bg-red-100 text-red-700');
    }
    function clearMsg() { msg.classList.add('hidden'); }

    let firebaseReady = false;
    try {
      if (window.FIREBASE_CONFIG && window.firebase) {
        firebase.initializeApp(window.FIREBASE_CONFIG);
        firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);
        firebaseReady = true;
      }
    } catch (e) { console.warn(e); }

    if (!firebaseReady) {
      showMsg('Firebase is not configured. Fill in firebase-config.js.', false);
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('bg-[#323540]','text-white'); b.classList.add('text-slate-400'); });
        btn.classList.add('bg-[#323540]','text-white'); btn.classList.remove('text-slate-400');
        const tab = btn.dataset.tab;
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
        $('form-' + tab).classList.remove('hidden');
        clearMsg();
      });
    });

    function go() { location.href = 'index.html'; }

    $('google-btn').addEventListener('click', async () => {
      clearMsg();
      if (!firebaseReady) return;
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        await firebase.auth().signInWithPopup(provider);
        go();
      } catch (e) { showMsg(e.message || 'Google sign-in failed.', false); }
    });

    $('form-login').addEventListener('submit', async (e) => {
      e.preventDefault(); clearMsg();
      if (!firebaseReady) return;
      try {
        await firebase.auth().signInWithEmailAndPassword($('login-email').value.trim(), $('login-password').value);
        go();
      } catch (e) { showMsg(e.message || 'Login failed.', false); }
    });

    $('form-register').addEventListener('submit', async (e) => {
      e.preventDefault(); clearMsg();
      if (!firebaseReady) return;
      try {
        const cred = await firebase.auth().createUserWithEmailAndPassword($('reg-email').value.trim(), $('reg-password').value);
        try { await cred.user.updateProfile({ displayName: $('reg-name').value.trim() }); } catch (err) {}
        go();
      } catch (e) { showMsg(e.message || 'Registration failed.', false); }
    });
  </script>
</body>
</html>
